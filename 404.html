<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Salesforcepedia</title>
  <meta name="description" content="The page you're looking for doesn't exist. Return to Salesforcepedia.">
  <link rel="stylesheet" href="css/global.css">
  <style>
    .error-wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 80px 24px;
      text-align: center;
    }
    .error-code {
      font-size: 96px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(90deg, var(--accent), var(--accent2, #8b5cf6));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }
    .error-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .error-home {
      display: inline-block;
      padding: 12px 28px;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .error-home:hover { opacity: 0.85; }
  </style>
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="brand">Salesforce<span>pedia</span></a>
  <a href="index.html" class="nav-link">Home</a>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme"></button>
</nav>

<div class="error-wrap">
  <div class="error-code">404</div>
  <div class="error-title">Page not found</div>
  <p class="error-desc">The page you're looking for doesn't exist or may have been moved. Head back to the home page to find what you need.</p>
  <a href="index.html" class="error-home">← Back to Home</a>
</div>

</body>
</html>
