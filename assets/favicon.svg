<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      @media (prefers-color-scheme: light) {
        .bg   { fill: #ffffff; }
        .hex  { stroke: #0284c7; }
        .node { fill: #0284c7; }
        .line { stroke: #0284c7; }
      }
      @media (prefers-color-scheme: dark) {
        .bg   { fill: #211d2e; }
        .hex  { stroke: #7dd3fc; }
        .node { fill: #7dd3fc; }
        .line { stroke: #7dd3fc; }
      }
    </style>
  </defs>

  <!-- background -->
  <rect width="32" height="32" rx="7" class="bg"/>

  <!-- hexagon -->
  <polygon
    points="16,4 26,9.5 26,22.5 16,28 6,22.5 6,9.5"
    fill="none"
    class="hex"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!-- connector lines (circuit traces) -->
  <line x1="16" y1="4"  x2="16" y2="10" class="line" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="9.5" x2="21" y2="13" class="line" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6"  y1="22.5" x2="11" y2="19" class="line" stroke-width="1.5" stroke-linecap="round"/>

  <!-- center node -->
  <circle cx="16" cy="16" r="3" class="node"/>

  <!-- small junction nodes -->
  <circle cx="16" cy="10"  r="1.4" class="node"/>
  <circle cx="21" cy="13"  r="1.4" class="node"/>
  <circle cx="11" cy="19"  r="1.4" class="node"/>
</svg>
